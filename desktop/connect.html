<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Caravan — Connect</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101218; color: #e8eaf0; font: 15px system-ui, "Segoe UI", sans-serif; }
  .card { width: min(400px, 90vw); padding: 28px; background: #181b23; border: 1px solid #2a2f3b; border-radius: 14px; }
  h1 { font-size: 22px; margin: 0 0 6px; } p { color: #9aa1b2; margin: 0 0 18px; }
  input { width: 100%; box-sizing: border-box; height: 42px; padding: 0 12px; border-radius: 6px; border: 1px solid #2a2f3b; background: #101218; color: inherit; font: inherit; }
  button { margin-top: 14px; width: 100%; height: 46px; border: 0; border-radius: 6px; background: #8b5cf6; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .err { color: #ef4444; min-height: 20px; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Connect to a server</h1>
    <p>Enter the address of your Caravan server.</p>
    <input id="url" placeholder="http://192.168.1.10:8420" autofocus />
    <button>Connect</button>
    <div class="err" id="err"></div>
  </form>
<script>
  const $ = id => document.getElementById(id)
  window.caravanDesktop.currentServer().then(s => { $('url').value = s || 'http://localhost:8420' })
  $('f').addEventListener('submit', async e => {
    e.preventDefault()
    let u = $('url').value.trim()
    if (!/^https?:\/\//.test(u)) u = 'http://' + u
    $('err').textContent = 'Connecting…'
    const r = await window.caravanDesktop.connect(u)
    if (!r.ok) $('err').textContent = r.error
  })
</script>
</body>
</html>
